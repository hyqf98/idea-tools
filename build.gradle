plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
}

import org.gradle.internal.os.OperatingSystem
import org.jetbrains.intellij.platform.gradle.tasks.BuildSearchableOptionsTask
import org.jetbrains.intellij.platform.gradle.tasks.RunIdeTask

// 配置构建时显示更清晰的信息
group = providers.gradleProperty('pluginGroup').get()
version = providers.gradleProperty('pluginVersion').get()

def localIdeaPath = '/Applications/IntelliJ IDEA.app'
def useLocalIntellijPlatform = OperatingSystem.current().isMacOsX() && file(localIdeaPath).exists()

repositories {
    // 优先使用本地Maven仓库
    mavenLocal()

    // 国内镜像源（阿里云）- 优先级最高
    maven {
        url 'https://maven.aliyun.com/repository/public'
        name 'Aliyun Public'
    }
    maven {
        url 'https://maven.aliyun.com/repository/central'
        name 'Aliyun Central'
    }

    // Maven中央仓库
    mavenCentral()

    // IntelliJ Platform 仓库（使用JetBrains Cache Redirector加速）
    intellijPlatform {
        defaultRepositories()
        if (useLocalIntellijPlatform) {
            // 使用本地 IDE 时，需要 localPlatformArtifacts 来处理本地依赖
            localPlatformArtifacts()
        }
    }
}

dependencies {
    // IntelliJ Platform依赖 (2.x新语法)
    intellijPlatform {
        if (useLocalIntellijPlatform) {
            // macOS 且默认 IDEA 路径存在时，优先使用本地 IDE
            local(localIdeaPath)
        } else {
            // 其他环境或本地 IDE 不存在时，回退到下载平台版本
            create(providers.gradleProperty('platformType').get(), providers.gradleProperty('platformVersion').get())
        }

        // 绑定插件
        bundledPlugin('com.intellij.java')

        // 插件开发工具
        instrumentationTools()

        // 插件验证器
        pluginVerifier()
    }

    // 第三方依赖
//    implementation "cn.hutool:hutool-all:${providers.gradleProperty('hutool.version').get()}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${providers.gradleProperty('jackson.version').get()}"

    compileOnly "org.projectlombok:lombok:${providers.gradleProperty('lombok.version').get()}"
    annotationProcessor "org.projectlombok:lombok:${providers.gradleProperty('lombok.version').get()}"

    // 测试依赖
    testImplementation "junit:junit:${providers.gradleProperty('junit4.version').get()}"
    testImplementation platform("org.junit:junit-bom:${providers.gradleProperty('junit5.version').get()}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// Java编译配置
// 使用Java工具链确保使用正确的Java版本编译
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty('javaVersion').get())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks {
    runIde {
        jvmArgs = ['-XX:+AllowEnhancedClassRedefinition']
    }

    test {
        useJUnitPlatform()
    }
}

def disabledCoroutinesAgent = layout.projectDirectory.file('.intellijPlatform/disabled-coroutines-javaagent.jar')

tasks.withType(RunIdeTask).configureEach {
    // Work around a 2026.1 startup failure caused by the generated coroutines agent jar.
    coroutinesJavaAgentFile.set(disabledCoroutinesAgent)
    systemProperty 'idea.ui.icons.svg.disk.cache', 'false'
}

tasks.withType(BuildSearchableOptionsTask).configureEach {
    // Searchable options launch a headless IDE and hit the same broken agent initialization path.
    coroutinesJavaAgentFile.set(disabledCoroutinesAgent)
    systemProperty 'idea.ui.icons.svg.disk.cache', 'false'
}

// 配置IntelliJ平台插件 2.x
// 支持版本范围: 2020.3 (203) - 2026.1 (261)
// 测试版本说明:
//   - 开发基准版本: 2026.1 IU (插件用Java 21编译, IDE运行需要Java 21)
//   - 测试版本:
//     * 2020.3 (203) - 最后一个 Java 11 版本
//     * 2021.3 (213) - Java 11
//     * 2022.3 (223) - Java 17 起点版本
//     * 2023.3.7 (233) - Java 17 (指定版本)
//     * 2024.3.2 (243) - Java 21 (指定版本)
//     * 2025.2.5 (252) - Java 21 (指定版本)
//     * 2025.3 (253) - Java 21 (指定版本)
//     * 2026.1 (261) - Java 21 (指定版本)
// 切换测试版本方法: 修改 gradle.properties 中的 platformVersion
//
// 注意: 为了支持Python PSI类，同时依赖PyCharm Community Edition
// 这样可以在编译时解析Python相关类，运行时插件仍然可以在IntelliJ IDEA中使用
intellijPlatform {
    buildSearchableOptions = false

    pluginConfiguration {
        name = providers.gradleProperty('pluginName')
        version = providers.gradleProperty('pluginVersion')

        ideaVersion {
            sinceBuild = providers.gradleProperty('platformSinceBuild')
            untilBuild = providers.gradleProperty('platformUntilBuild')
        }
    }
}
